name: Build and Release SalsaNOW

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore SalsaNOW.sln

      - name: Build Release
        run: msbuild SalsaNOW.sln /p:Configuration=Release /p:Platform="Any CPU"

      - name: Find EXE
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path . -Filter "SalsaNOW.exe" -Recurse |
            Where-Object { $_.FullName -match "\\bin\\Release\\" } |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "SalsaNOW.exe not found"
            exit 1
          }

          Copy-Item $exe.FullName ".\SalsaNOW.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "SalsaNOW Build ${{ github.run_number }}"
          files: SalsaNOW.exe
          generate_release_notes: true
